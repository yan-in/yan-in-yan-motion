<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aguardando Pagamento | Yan Epifanio</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/yan.css?v=10">
  
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MB823YVY9Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MB823YVY9Y');
    // Rastrear pagamento pendente
    gtag('event', 'payment_pending', {
      status: 'pending'
    });
  </script>
</head>
<body>
  <main class="status-page">
    <section class="status-card" aria-labelledby="status-title">
      <div class="status-spinner" aria-hidden="true"></div>
      <h1 class="status-title" id="status-title">Aguardando pagamento</h1>
      <p class="status-message">Identificamos sua ordem de pagamento. Assim que o pagamento for confirmado, você será redirecionado automaticamente.</p>
      <p class="status-note">Não feche esta página.</p>
      <p class="status-detail" id="debug" role="status" aria-live="polite">Carregando...</p>
      <div class="status-actions">
        <a href="https://yanepifanio.com.br" class="btn btn--ghost">Voltar para o início</a>
      </div>
    </section>
  </main>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const paymentId = urlParams.get('payment_id') || urlParams.get('collection_id');
      const debugEl = document.getElementById('debug');

      if (!paymentId) {
        debugEl.textContent = 'Nenhum ID de pagamento encontrado.';
        return;
      }

      debugEl.textContent = `Aguardando confirmação do pagamento ID: ${paymentId}`;

      let attempts = 0;
      const maxAttempts = 120; // 120 * 3s = 6 minutos

      function recordPurchaseAndRedirect() {
        let redirected = false;
        function redirect() {
          if (redirected) return;
          redirected = true;
          window.location.assign(`/success.html?payment_id=${encodeURIComponent(paymentId)}`);
        }

        gtag('event', 'purchase', {
          transaction_id: paymentId,
          event_callback: redirect,
          event_timeout: 1500
        });
        setTimeout(redirect, 1800);
      }

      async function checkStatus() {
        try {
          const response = await fetch(
            `https://mercado-pago-api.yan-dossantos-543.workers.dev/payment_status?payment_id=${encodeURIComponent(paymentId)}`,
            { cache: 'no-store' }
          );

          const raw = await response.text();
          let data;
          try {
            data = JSON.parse(raw);
          } catch (_) {
            debugEl.textContent = 'Erro ao processar resposta do servidor. Tentando novamente...';
            setTimeout(checkStatus, 5000);
            return;
          }

          if (!response.ok) {
            debugEl.textContent = `Erro ${response.status}: ${data.error || 'Falha na consulta'}. Tentando novamente...`;
            setTimeout(checkStatus, 5000);
            return;
          }

          // ✅ Redireciona para sucesso
          if (data.status === 'approved') {
            recordPurchaseAndRedirect();
            return;
          }

          // ❌ Redireciona para falha (incluindo charged_back)
          if (
            data.status === 'rejected' ||
            data.status === 'cancelled' ||
            data.status === 'refunded' ||
            data.status === 'charged_back'
          ) {
            window.location.href = `/failure.html?payment_id=${encodeURIComponent(paymentId)}`;
            return;
          }

          // ⏳ Ainda pendente (in_process, pending, etc.)
          attempts++;
          if (attempts >= maxAttempts) {
            debugEl.textContent = 'O pagamento está demorando mais que o esperado. Você pode verificar manualmente ou tentar novamente.';
            return;
          }

          debugEl.textContent = `Aguardando... (${Math.floor(attempts * 3)}s)`;
          setTimeout(checkStatus, 3000);

        } catch (error) {
          console.error('Erro ao verificar status:', error);
          debugEl.textContent = 'Erro ao consultar status. Tentando novamente...';
          setTimeout(checkStatus, 5000);
        }
      }

      checkStatus();
    })();
  </script>
</body>
</html>
